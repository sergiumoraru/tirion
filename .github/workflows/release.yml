name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}

jobs:
  portable-checks:
    uses: ./.github/workflows/parser-fixture-gate.yml

  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Require release configuration before building
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [[ "$RELEASE_REPOSITORY" != "$GITHUB_REPOSITORY" && -z "$RELEASE_TOKEN" ]]; then
            echo 'An external RELEASE_REPOSITORY requires RELEASE_REPO_TOKEN with release-upload access to that repository.' >&2
            exit 1
          fi

  release-windows-mcp:
    runs-on: windows-latest
    needs: [prepare-release, portable-checks]
    env:
      WINDOWS_CODESIGN_ENABLED: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 != '' && secrets.WINDOWS_CODESIGN_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup MSYS2 MinGW
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build Windows MCP bundle
        shell: powershell
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = (Join-Path $env:MSYS2_ROOT 'ucrt64\bin') + ';' + $env:PATH
          pwsh -ExecutionPolicy Bypass -File .\scripts\build-windows-release.ps1 -Version $env:GITHUB_REF_NAME -SkipDbCheck

      - name: Sign Windows MCP binaries
        env:
          WINDOWS_CODESIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        if: ${{ env.WINDOWS_CODESIGN_ENABLED == 'true' }}
        shell: powershell
        run: |
          $certDir = Join-Path $env:RUNNER_TEMP "codesign"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $pfxPath = Join-Path $certDir "tirion-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_B64))

          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
              $signtoolPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1 -ExpandProperty FullName
              if (-not $signtoolPath) {
                  throw "signtool.exe not found"
              }
              $signtoolExe = $signtoolPath
          } else {
              $signtoolExe = $signtool.Source
          }

          $timestampUrl = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
              $timestampUrl = "http://timestamp.digicert.com"
          }

          Get-ChildItem "dist\windows-amd64-mcp\*.exe" | ForEach-Object {
              & $signtoolExe sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CODESIGN_PASSWORD /tr $timestampUrl /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) {
                  throw "signtool failed for $($_.FullName)"
              }
          }

      - name: Repack signed Windows MCP bundle
        if: ${{ env.WINDOWS_CODESIGN_ENABLED == 'true' }}
        shell: powershell
        run: |
          $zipPath = Join-Path (Resolve-Path .) "dist\tirion-mcp-$env:GITHUB_REF_NAME-windows-amd64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "dist\windows-amd64-mcp\*" -DestinationPath $zipPath -Force

      - name: Stage Windows MCP bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-mcp
          path: dist/tirion-mcp-*.zip
          if-no-files-found: error

  release-linux:
    runs-on: ubuntu-latest
    needs: [prepare-release, portable-checks]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build release bundles
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
        run: |
          bash scripts/build-dist.sh "$GITHUB_REF_NAME"

      - name: Build frontend bundle
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd frontend
          npm ci
          VITE_API_URL=/api npm run build

          mkdir -p ../dist/frontend-staging
          rm -rf ../dist/frontend-staging/*
          cp -r dist/. ../dist/frontend-staging/
          cp ../LICENSE ../dist/frontend-staging/

          cd ../dist
          tar -czf "tirion-frontend-${TAG}.tar.gz" -C frontend-staging .

      - name: Stage Linux and frontend bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: dist/tirion-*.tar.gz
          if-no-files-found: error

  finalize-release:
    runs-on: ubuntu-latest
    needs: [portable-checks, release-linux, release-windows-mcp]
    permissions:
      contents: write
    env:
      RELEASE_SIGNING_ENABLED: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Collect this run's release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksum manifest
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE_COMMIT.txt
          go run ./cmd/release-sign manifest -dir release-assets -out release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum SOURCE_COMMIT.txt) >> release-assets/SHA256SUMS.txt

      - name: Sign checksum manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        if: ${{ env.RELEASE_SIGNING_ENABLED == 'true' }}
        shell: bash
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_file"
          go run ./cmd/release-sign sign \
            -in release-assets/SHA256SUMS.txt \
            -privkey "$key_file" \
            -out release-assets/SHA256SUMS.txt.sig
          go run ./cmd/release-sign pubkey \
            -privkey "$key_file" \
            -out release-assets/SHA256SUMS.public.key

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            export GH_TOKEN="$EXTERNAL_RELEASE_TOKEN"
          fi
          TAG="$GITHUB_REF_NAME"
          NOTE_FILE="$(mktemp)"
          trap 'rm -f "$NOTE_FILE"' EXIT
          cat > "$NOTE_FILE" <<'EOF'
          ## Downloads

          - Linux server: tirion, parse, required indexing extractors, and the optional EventBridge importer.
          - MCP: developer-local mcp-intel and mcp-guard (Linux and Windows).
          - Linux tools: impact-report, contracts-report, and audit-index.
          - Frontend: static UI bundle; serve alongside the API through your proxy.

          SHA256SUMS.txt covers every archive. A signature and public key are
          included when release signing is configured. See the bundled operator
          runbook for installation.
          EOF

          printf '\nSource commit: `%s`\nPortable checks: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$NOTE_FILE"

          if DRAFT="$(gh release view "$TAG" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$DRAFT" != true ]]; then
              echo "Release $TAG is already published; use a new version rather than replacing its artifacts." >&2
              exit 1
            fi
            gh release view "$TAG" --repo "$RELEASE_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
            while IFS= read -r asset; do
              if [[ ! -f "release-assets/$asset" ]]; then
                echo "Draft contains an asset outside this build: $asset. Remove it before retrying." >&2
                exit 1
              fi
            done < existing-assets.txt
          else
            gh release create "$TAG" --repo "$RELEASE_REPOSITORY" --draft \
              --title "Tirion $TAG" --notes-file "$NOTE_FILE"
          fi
          gh release upload "$TAG" release-assets/* --repo "$RELEASE_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$RELEASE_REPOSITORY" --notes-file "$NOTE_FILE" --draft=false
