name: Impact Report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    # Estate-backed reporting is an opt-in integration, not a portable PR gate.
    # Fork PRs must not require or receive private server credentials.
    if: ${{ vars.ENABLE_ESTATE_IMPACT == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build impact-report
        run: go build -o impact-report ./cmd/impact-report

      - name: Build parse
        run: go build -o parse ./cmd/parse

      - name: Generate report
        env:
          IMPACT_SERVER: ${{ secrets.IMPACT_SERVER }}
          TIRION_API_TOKEN: ${{ secrets.TIRION_API_TOKEN }}
          # Optional. Without it the server infers the repository from the diff
          # paths; set it only when those paths are ambiguous across repositories.
          IMPACT_REPO: ${{ secrets.IMPACT_REPO }}
        run: |
          if [ -z "$IMPACT_SERVER" ]; then
            echo "IMPACT_SERVER secret is required" >&2
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "$IMPACT_REPO" ]; then
            git diff -U0 "$BASE...$HEAD" | ./impact-report -repo="$IMPACT_REPO" -ref="$HEAD" -repo-path=. -server="$IMPACT_SERVER" -timeout=120s -out impact.md
          else
            git diff -U0 "$BASE...$HEAD" | ./impact-report -server="$IMPACT_SERVER" -timeout=120s -out impact.md
          fi

      - name: Post report to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('impact.md', 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impact-report
          path: impact.md
